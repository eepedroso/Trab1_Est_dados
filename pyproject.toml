[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-sequencial-indexado"
version = "1.0.0"
description = "Organização sequencial indexada em arquivos binários, com buscas em disco."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ecommerce = "ecommerce.cli:main"

[tool.setuptools.packages.find]
include = ["ecommerce*"]
